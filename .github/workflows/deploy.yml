name: deploy

# Every push to main that changes the pipeline code: run the tests, build the package and install it on the VM.
# GitHub reaches the VM through an IAP tunnel and OS Login (keyless, no public IP); see docs/deploy.md.
# Needs the repository variables printed by `terraform output github_variables`.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VM_NAME: firms-ua-dev-dagster
  VM_ZONE: europe-west1-b

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no stored keys)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the package
        run: |
          pip install build
          python -m build --wheel

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy the package to the VM and install it
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          WHEEL="$(ls dist/*.whl)"
          NAME="$(basename "$WHEEL")"
          COMMON=(--zone "$VM_ZONE" --project "$PROJECT" --tunnel-through-iap --quiet --strict-host-key-checking=no)
          # Copy into the deploy user's own home directory: a shared /tmp can hold files of other users that it may not overwrite.
          gcloud compute scp "${COMMON[@]}" "$WHEEL" "$VM_NAME:$NAME"
          gcloud compute ssh "$VM_NAME" "${COMMON[@]}" \
            --command "sudo /usr/local/sbin/firms-ua-install \"\$HOME/$NAME\" && rm -f \"\$HOME/$NAME\""

      - name: Summary
        run: echo "Installed ${GITHUB_SHA} on ${VM_NAME}" >> "$GITHUB_STEP_SUMMARY"
