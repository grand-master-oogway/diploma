name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # also reused by deploy.yml as the gate before an image is built

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e . pytest responses
      - name: Test
        run: pytest -q
